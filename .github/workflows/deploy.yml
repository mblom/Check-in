name: Deploy naar Portainer

# Triggert bij elke push naar main de Portainer-stack-webhook, zodat de
# stack de nieuwste commit ophaalt en het image opnieuw bouwt.
# Handmatig starten kan ook via de "Run workflow"-knop (workflow_dispatch).

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  redeploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Portainer redeploy
        run: curl -fsS -X POST "${{ secrets.PORTAINER_WEBHOOK_URL }}"
