services:
  check-in:
    # Image wordt door GitHub Actions gebouwd en naar GHCR gepusht.
    # Portainer pullt dit image; lokaal bouwen kan via de Dockerfile.
    image: ghcr.io/mblom/check-in:latest
    container_name: check-in
    restart: unless-stopped
    ports:
      # host:container — pas de hostpoort (8080) aan naar wens
      - "8080:80"
